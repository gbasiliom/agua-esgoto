name: Compilar APK - Cliente

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Endereço do servidor (ex.: https://api.seudominio.com.br ou http://IP:8000). Vazio = usa a variável API_BASE_URL do repositório ou o que está no config.py'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Aceitar licenças do Android SDK
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Instalar Buildozer e Cython
        run: |
          python -m pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython<3.0.0"

      - name: Configurar URL da API (se informada)
        if: "${{ github.event.inputs.api_url != '' }}"
        run: |
          sed -i 's|API_BASE_URL = .*|API_BASE_URL = "${{ github.event.inputs.api_url }}"|' app_cliente/config.py

      - name: Compilar APK com Buildozer
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          cd app_cliente
          buildozer -v android debug

      - name: Publicar APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: APK-Cliente
          path: app_cliente/bin/*.apk