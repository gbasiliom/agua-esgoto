name: Build APK - Técnico Água

on:
  push:
    branches: [main]
    paths:
      - "TecnicoAndroid/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir: TecnicoAndroid
          buildozer_version: stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tecnico-agua-apk
          path: TecnicoAndroid/bin/*.apk
